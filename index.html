<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Way a Crow Flies</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>The Way a Crow Flies</h1>
      <div class="tagline">FIND YOUR WAY</div>
    </header>

    <main class="map">

      <div class="search-box">
        <span class="search-icon">⌖</span>
        <span>Where are you going?</span>
      </div>

      <div class="map-point start-point">
        <span class="point-dot"></span>
        <span class="point-label">Start</span>
      </div>

      <div
        class="route"
        style="width: 65%; top: 50%; left: 18%; transform: rotate(-12deg);">
      </div>

      <div class="crow-marker">
        <div class="crow-symbol">
  <svg viewBox="0 0 64 64" width="30" height="30" aria-label="Crow marker">
    <path
      d="M11 42c7-2 11-7 13-14 1-6 5-12 12-14 4-1 9 0 13 3l8-2-5 7c2 4 2 9 0 13-3 6-9 10-16 10h-5l-6 8-1-10c-5 1-9 1-13-1z"
      fill="#101418"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linejoin="round">
    </path>
    <circle cx="43" cy="21" r="2" fill="#d6a84b"></circle>
  </svg>
</div>
        <span>CROW</span>
      </div>

      <div class="map-point destination-point">
        <span class="point-dot"></span>
        <span class="point-label">Destination</span>
      </div>

    </main>

    <nav class="tools">

      <div class="tool">
        <span class="tool-icon">⌖</span>
        Route
      </div>

      <div class="tool">
        <span class="tool-icon">★</span>
        Places
      </div>

      <div class="tool">
        <span class="tool-icon">☰</span>
        Tools
      </div>

      <div class="tool">
        <span class="tool-icon">⚙</span>
        Settings
      </div>

    </nav>

  </div>

</body>

</html>
