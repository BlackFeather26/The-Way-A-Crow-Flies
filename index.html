<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Way a Crow Flies</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>The Way a Crow Flies</h1>
      <div class="tagline">FIND YOUR WAY</div>
    </header>

    <main class="map">

      <div
        class="route"
        style="width: 65%; top: 48%; left: 18%; transform: rotate(-12deg);">
      </div>

    </main>

    <nav class="tools">

      <div class="tool">
        <span class="tool-icon">⌖</span>
        Route
      </div>

      <div class="tool">
        <span class="tool-icon">★</span>
        Places
      </div>

      <div class="tool">
        <span class="tool-icon">☰</span>
        Tools
      </div>

      <div class="tool">
        <span class="tool-icon">⚙</span>
        Settings
      </div>

    </nav>

  </div>

</body>
</html>
